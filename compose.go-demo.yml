name: idelium-go-demo

# Local Go-only demo. The Laravel services are intentionally absent.
services:
  ideliumdb:
    image: mariadb:10.6.22@sha256:7589b386fa6686a5d5f131b504ed21c81e492c48b78c6c4be0d5be1066542559
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-idelium_smoke}
      MARIADB_USER: ${DB_USERNAME:-idelium_smoke}
      MARIADB_PASSWORD: ${GO_API_DB_PASSWORD:?GO_API_DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - ../idelium-api-go/smoke/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ../idelium-api-go/smoke/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
      - idelium_go_demo_data:/var/lib/mysql
    networks: [idelium_go_demo]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --silent --host=127.0.0.1 --user=root --password=$$MARIADB_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 24

  ideliumapigo:
    image: idelium/api-go:demo
    build:
      context: ../idelium-api-go
      dockerfile: Dockerfile
      args:
        VERSION: demo
        SOURCE_REVISION: ${GO_API_SOURCE_REVISION:-working-tree}
    environment:
      IDELIUM_ENVIRONMENT: demo
      IDELIUM_HTTP_ADDRESS: ":8080"
      IDELIUM_DB_HOST: ideliumdb
      IDELIUM_DB_PORT: "3306"
      IDELIUM_DB_NAME: ${DB_DATABASE:-idelium_smoke}
      IDELIUM_DB_USER: ${DB_USERNAME:-idelium_smoke}
      IDELIUM_DB_PASSWORD: ${GO_API_DB_PASSWORD:?GO_API_DB_PASSWORD is required}
      IDELIUM_DB_TLS_MODE: "false"
    depends_on:
      ideliumdb:
        condition: service_healthy
    networks: [idelium_go_demo]
    healthcheck:
      test: ["CMD", "/idelium-api-go", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12

  ideliumfe:
    image: idelium/web:go-demo
    build:
      context: .
      dockerfile: idelium-fe/Dockerfile
      additional_contexts:
        web_source: ../idelium-web
      args:
        WEB_SOURCE_REVISION: ${WEB_SOURCE_REVISION:-working-tree}
        STACK_SOURCE_REVISION: ${STACK_SOURCE_REVISION:-working-tree}
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - idelium_go_demo_tls:/usr/local/apache2/certs
      - ./idelium-fe/conf/httpd-vhosts-idelium-go-ssl.conf:/usr/local/apache2/conf/extra/httpd-vhosts-idelium-ssl.conf:ro
    environment:
      TLS_MODE: development
      TLS_COMMON_NAME: ${TLS_COMMON_NAME:-localhost}
    depends_on:
      ideliumapigo:
        condition: service_healthy
    networks: [idelium_go_demo]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --cacert /usr/local/apache2/certs/server.crt https://localhost/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  idelium_go_demo:
    name: idelium-go-demo

volumes:
  idelium_go_demo_data:
  idelium_go_demo_tls:
